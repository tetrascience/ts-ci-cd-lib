name: ghactionlint — actionlint + zizmor

# Runs two complementary linters over the caller's .github/workflows/:
#   - actionlint: syntax, best-practice, and shellcheck lint
#   - zizmor:     security audit (pwn-requests, template injection,
#                 untrusted checkouts, permissions, stale action refs)
#
# Both binaries are downloaded directly from their GitHub release assets
# and verified against pinned SHA-256 hashes — no `bash <(curl ...)`,
# no pipx/PyPI in the trust path. If a caller overrides *_version, they
# must also override the matching *_sha256.

on:
  workflow_call:
    inputs:
      actionlint_version:
        description: "actionlint version to install"
        type: string
        default: "1.7.12"
        required: false
      actionlint_sha256:
        description: "SHA-256 of actionlint_<version>_linux_amd64.tar.gz (must match actionlint_version)"
        type: string
        default: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        required: false
      zizmor_version:
        description: "zizmor version to install"
        type: string
        default: "1.16.3"
        required: false
      zizmor_sha256:
        description: "SHA-256 of zizmor-x86_64-unknown-linux-gnu.tar.gz (must match zizmor_version)"
        type: string
        default: "f0070985e94dd7b29e30abe249f6c7b2f14078c35a8f2de78e2d6ce89de0c132"
        required: false

permissions:
  contents: read

jobs:
  ghactionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        env:
          VERSION: ${{ inputs.actionlint_version }}
          EXPECTED_SHA256: ${{ inputs.actionlint_sha256 }}
        # Downloads the release tarball and verifies it by SHA-256, rather than
        # piping a fetched script into bash. --retry covers the 429 that
        # raw.githubusercontent returns under load; the checksum is what makes
        # a wrong body fatal instead of executable.
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${EXPECTED_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          rm actionlint.tgz

      - name: Run actionlint
        run: ./actionlint -color

      - name: Install zizmor
        shell: bash
        env:
          VERSION: ${{ inputs.zizmor_version }}
          EXPECTED_SHA256: ${{ inputs.zizmor_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL -o zizmor.tgz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${EXPECTED_SHA256}  zizmor.tgz" | sha256sum -c -
          tar -xzf zizmor.tgz ./zizmor
          chmod +x ./zizmor
          rm zizmor.tgz

      - name: Run zizmor
        shell: bash
        env:
          # Token enables online audits (stale action refs, known-vulnerable
          # versions). Offline audits still run without it.
          GH_TOKEN: ${{ github.token }}
        # zizmor exits 1 when an audit cannot run at all, e.g. an online audit
        # whose token cannot see an internal repo the caller references. Then
        # re-run the offline audits instead of reporting no audit. Findings
        # (11-14) and every other non-zero exit still fail the job.
        run: |
          set -euo pipefail
          log=$(mktemp)
          rc=0
          ./zizmor --format plain . 2> "$log" || rc=$?
          cat "$log" >&2
          if [[ "$rc" -eq 1 ]]; then
            # zizmor's last "Caused by" line names the root cause.
            reason=$( { grep -v '^[[:space:]]*$' "$log" || true; } | tail -n 1 | sed -E 's/^[[:space:]]*[0-9]+: //; s/%/%25/g')
            reason="${reason:-see the zizmor error above}"
            echo "::warning title=zizmor online audits skipped::zizmor could not run its online audits (${reason}), so this result is from the offline audits only. impostor-commit, known-vulnerable-actions, ref-confusion and stale-action-refs did not run."
            rc=0
            ./zizmor --format plain --no-online-audits . || rc=$?
          fi
          exit "$rc"
