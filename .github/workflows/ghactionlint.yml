name: ghactionlint — actionlint + zizmor

# Runs two complementary linters over the caller's .github/workflows/:
#   - actionlint: syntax, best-practice, and shellcheck lint
#   - zizmor:     security audit (pwn-requests, template injection,
#                 untrusted checkouts, permissions, stale action refs)
#
# Both binaries are downloaded directly from their GitHub release assets
# and verified against pinned SHA-256 hashes — no `bash <(curl ...)`,
# no pipx/PyPI in the trust path. If a caller overrides *_version, they
# must also override the matching *_sha256.

on:
  workflow_call:
    inputs:
      actionlint_version:
        description: "actionlint version to install"
        type: string
        default: "1.7.12"
        required: false
      actionlint_sha256:
        description: "SHA-256 of actionlint_<version>_linux_amd64.tar.gz (must match actionlint_version)"
        type: string
        default: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        required: false
      zizmor_version:
        description: "zizmor version to install"
        type: string
        default: "1.16.3"
        required: false
      zizmor_sha256:
        description: "SHA-256 of zizmor-x86_64-unknown-linux-gnu.tar.gz (must match zizmor_version)"
        type: string
        default: "f0070985e94dd7b29e30abe249f6c7b2f14078c35a8f2de78e2d6ce89de0c132"
        required: false

permissions:
  contents: read

jobs:
  ghactionlint:
    name: GitHub Actions lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        env:
          VERSION: ${{ inputs.actionlint_version }}
          EXPECTED_SHA256: ${{ inputs.actionlint_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${VERSION}/actionlint_${VERSION}_linux_amd64.tar.gz"
          echo "${EXPECTED_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          rm actionlint.tgz

      - name: Run actionlint
        run: ./actionlint -color

      - name: Install zizmor
        shell: bash
        env:
          VERSION: ${{ inputs.zizmor_version }}
          EXPECTED_SHA256: ${{ inputs.zizmor_sha256 }}
        run: |
          set -euo pipefail
          curl -fsSL -o zizmor.tgz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${EXPECTED_SHA256}  zizmor.tgz" | sha256sum -c -
          tar -xzf zizmor.tgz ./zizmor
          chmod +x ./zizmor
          rm zizmor.tgz

      - name: Run zizmor
        shell: bash
        env:
          # Token enables online audits (stale action refs, known-vulnerable
          # versions). Offline audits still run without it.
          GH_TOKEN: ${{ github.token }}
        run: ./zizmor --format plain .
