name: ghactionlint — actionlint + zizmor

# Runs two complementary linters over the caller's .github/workflows/:
#   - actionlint: syntax, best-practice, and shellcheck lint
#   - zizmor:     security audit (pwn-requests, template injection,
#                 untrusted checkouts, permissions, stale action refs)

on:
  workflow_call:
    inputs:
      actionlint_version:
        description: "actionlint version to install"
        type: string
        default: "1.7.12"
        required: false
      zizmor_version:
        description: "zizmor version to install"
        type: string
        default: "1.4.1"
        required: false

permissions:
  contents: read

jobs:
  ghactionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: ${{ inputs.actionlint_version }}
        # Pinned to v1.7.12 commit SHA — tags can be force-pushed.
        # Fetched to a file rather than piped into bash: raw.githubusercontent
        # answers 429 under load, and `bash <(curl -s ...)` then EXECUTES the
        # rate-limit prose, failing as `line 2: syntax error near ('`.
        run: |
          set -euo pipefail
          url=https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 5 -o download-actionlint.bash "$url"
          # Guard the body too: -f covers an HTTP error status, not a 200 that
          # returns something other than the script.
          if ! head -1 download-actionlint.bash | grep -q '^#!'; then
            echo "::error::Not a script — first bytes: $(head -c 200 download-actionlint.bash)"
            exit 1
          fi
          bash download-actionlint.bash "$ACTIONLINT_VERSION"
          rm -f download-actionlint.bash

      - name: Run actionlint
        run: ./actionlint -color

      - name: Install zizmor
        shell: bash
        env:
          ZIZMOR_VERSION: ${{ inputs.zizmor_version }}
        run: pipx install "zizmor==${ZIZMOR_VERSION}"

      - name: Run zizmor
        shell: bash
        env:
          # Token enables online audits (stale action refs, known-vulnerable
          # versions). Offline audits still run without it.
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .
