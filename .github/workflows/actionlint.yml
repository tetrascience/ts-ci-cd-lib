name: Actionlint — GitHub Actions workflow linter

on:
  workflow_call:
    inputs:
      version:
        description: "actionlint version to install"
        type: string
        default: "1.7.12"
        required: false

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: ${{ inputs.version }}
        # Pinned to v1.7.12 commit SHA — tags can be force-pushed
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"

      - name: Run actionlint
        # -shellcheck="" disables shellcheck integration — GitHub Actions
        # run blocks use ${{ }} expressions that shellcheck can't reason about,
        # producing false positives. Actionlint's own checks still catch
        # syntax errors, type mismatches, and security issues.
        run: ./actionlint -color -shellcheck=""
