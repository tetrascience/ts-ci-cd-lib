name: Actionlint — GitHub Actions workflow linter

on:
  workflow_call:
    inputs:
      version:
        description: "actionlint version to install"
        type: string
        default: "1.7.12"
        required: false

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install actionlint
        shell: bash
        env:
          ACTIONLINT_VERSION: ${{ inputs.version }}
        run: bash <(curl -s https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash) "$ACTIONLINT_VERSION"

      - name: Run actionlint
        run: ./actionlint -color
