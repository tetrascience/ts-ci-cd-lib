name: Publish npm package

on:
  workflow_call:
    inputs:
      node_version:
        description: Node.js version
        type: string
        default: "20"
        required: false
      working_directory:
        description: "Directory containing the package to publish (default: repo root)"
        type: string
        default: "."
        required: false
      prerelease_tag:
        description: "Prerelease tag for version suffix and npm dist-tag (e.g., alpha, beta). Leave empty for non-prerelease versions."
        type: string
        default: ""
        required: false
      run_tests:
        required: false
        description: Whether to run tests before publishing
        type: boolean
        default: true
      publish_to_public_npm:
        description: "Set to true to confirm publishing to public npm registry (https://registry.npmjs.org)"
        type: boolean
        default: false
        required: false
      pre_install_command:
        description: "Shell command to run after checkout + auth but before install. Runs at the REPO ROOT (not working_directory). Use for codegen that produces the working_directory contents (e.g., OpenAPI client generation)."
        type: string
        default: ""
        required: false
    secrets:
      AUTH_TOKEN:
        required: false
      REGISTRY:
        required: false
      PUBLISH_REGISTRY:
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: artifactory-prod
    defaults:
      run:
        working-directory: ${{ inputs.working_directory }}

    steps:
      - uses: actions/checkout@v4

      - name: Validate configuration for public npm registry
        env:
          PUBLISH_REGISTRY: ${{ secrets.PUBLISH_REGISTRY }}
          PUBLISH_TO_PUBLIC_NPM: ${{ inputs.publish_to_public_npm }}
        run: |
          NORMALIZED_REGISTRY=$(echo "$PUBLISH_REGISTRY" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          if [[ "$NORMALIZED_REGISTRY" == "https://registry.npmjs.org" ]]; then
            if [[ "$PUBLISH_TO_PUBLIC_NPM" != "true" ]]; then
              echo "ERROR: PUBLISH_REGISTRY is set to public npm registry but publish_to_public_npm input is not true."
              echo "To publish to the public npm registry, set the 'publish_to_public_npm' input to true."
              echo "This is a safety check since npm publishes are immutable after 72 hours."
              exit 1
            fi
            echo "Will publish to public npm registry using OIDC trusted publishing"
            echo "Caller workflow must have 'permissions: id-token: write' for OIDC to work"
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}

      - name: Enable Corepack
        run: |
          corepack enable
          echo "Yarn version: $(yarn --version)"

      - name: Install npm for OIDC support
        if: inputs.publish_to_public_npm == true
        run: |
          npm install -g npm@latest
          echo "Installed npm version: $(npm --version)"

      - name: Configure JFrog Artifactory
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          REGISTRY: ${{ secrets.REGISTRY }}
        run: |
          if [[ -n "$AUTH_TOKEN" ]]; then
            EFFECTIVE_REGISTRY="${REGISTRY:-https://registry.npmjs.org}"
            yarn config set npmRegistryServer "$EFFECTIVE_REGISTRY"
            yarn config set npmAuthIdent "$AUTH_TOKEN"
            yarn config set npmAlwaysAuth true
          else
            echo "No AUTH_TOKEN provided, skipping JFrog Artifactory configuration"
          fi

      - name: Pre-install setup
        if: inputs.pre_install_command != ''
        working-directory: "."
        env:
          PRE_INSTALL_CMD: ${{ inputs.pre_install_command }}
        run: eval "$PRE_INSTALL_CMD"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check if Typescript
        id: check_typescript
        uses: andstor/file-existence-action@v3
        with:
          files: "${{ inputs.working_directory }}/tsconfig.json"

      - name: Build package
        if: steps.check_typescript.outputs.files_exists == 'true'
        run: yarn build

      - name: Run tests
        if: ${{ inputs.run_tests }}
        run: yarn test

      # Non-prerelease: Match tag to package version
      - name: Match tag to package version
        if: inputs.prerelease_tag == ''
        id: match-version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          echo "TAG_VERSION=$TAG_VERSION" >> $GITHUB_OUTPUT
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "ERROR: Git tag (v$TAG_VERSION) does not match package.json version ($PACKAGE_VERSION)"
            exit 1
          fi
          echo "Git tag matches package.json version: $PACKAGE_VERSION"

      # Prerelease: Update version with prerelease suffix
      - name: Update version for prerelease
        if: inputs.prerelease_tag != ''
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          NEW_VERSION="${CURRENT_VERSION}-${{ inputs.prerelease_tag }}.${{ github.run_number }}.${{ github.run_attempt }}"
          jq --arg v "$NEW_VERSION" '.version = $v' package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Publishing version: $NEW_VERSION"

      # Public registry: Replace @tetrascience with @tetrascience-npm
      - name: Update package scope for public registry
        env:
          PUBLISH_REGISTRY: ${{ secrets.PUBLISH_REGISTRY }}
        run: |
          NORMALIZED_REGISTRY=$(echo "$PUBLISH_REGISTRY" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          if [[ "$NORMALIZED_REGISTRY" == "https://registry.npmjs.org" ]]; then
            PACKAGE_NAME=$(node -p "require('./package.json').name")
            if [[ $PACKAGE_NAME == @tetrascience/* ]]; then
              NEW_PACKAGE_NAME=$(echo $PACKAGE_NAME | sed 's/@tetrascience\//@tetrascience-npm\//')
              echo "Updating package name from $PACKAGE_NAME to $NEW_PACKAGE_NAME"
              npm pkg set name="$NEW_PACKAGE_NAME"
            else
              echo "Package name does not start with @tetrascience/, skipping scope update"
            fi
          else
            echo "Not publishing to public registry, skipping scope update"
          fi

      - name: Configure registry for publishing
        env:
          PUBLISH_REGISTRY: ${{ secrets.PUBLISH_REGISTRY }}
        run: |
          NORMALIZED_REGISTRY=$(echo "$PUBLISH_REGISTRY" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          if [[ "$NORMALIZED_REGISTRY" == "https://registry.npmjs.org" ]]; then
            echo "Configuring public npm registry (OIDC trusted publishing)"
            yarn config set npmRegistryServer "https://registry.npmjs.org"
            yarn config unset npmAuthIdent
            yarn config unset npmAuthToken
          else
            echo "Configuring private registry (JFrog Artifactory)"
            yarn config set npmRegistryServer "$PUBLISH_REGISTRY"
          fi

      # Non-prerelease: Publish only if tag matches version
      - name: Publish package
        if: inputs.prerelease_tag == '' && steps.match-version.outputs.PACKAGE_VERSION == steps.match-version.outputs.TAG_VERSION
        env:
          PUBLISH_REGISTRY: ${{ secrets.PUBLISH_REGISTRY }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          NORMALIZED_REGISTRY=$(echo "$PUBLISH_REGISTRY" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          if [[ "$NORMALIZED_REGISTRY" == "https://registry.npmjs.org" ]]; then
            PROVENANCE_FLAG=""
            if [[ "$REPO_VISIBILITY" == "public" ]]; then
              PROVENANCE_FLAG="--provenance"
            else
              echo "Skipping --provenance (repo visibility: $REPO_VISIBILITY, provenance requires public repos)"
            fi
            npm publish $PROVENANCE_FLAG --access public
          else
            yarn npm publish
          fi

      # Prerelease: Publish with dist-tag
      - name: Publish package (prerelease)
        if: inputs.prerelease_tag != ''
        env:
          PUBLISH_REGISTRY: ${{ secrets.PUBLISH_REGISTRY }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          REPO_VISIBILITY: ${{ github.event.repository.visibility }}
        run: |
          NORMALIZED_REGISTRY=$(echo "$PUBLISH_REGISTRY" | sed 's:/*$::' | tr '[:upper:]' '[:lower:]')
          if [[ "$NORMALIZED_REGISTRY" == "https://registry.npmjs.org" ]]; then
            PROVENANCE_FLAG=""
            if [[ "$REPO_VISIBILITY" == "public" ]]; then
              PROVENANCE_FLAG="--provenance"
            else
              echo "Skipping --provenance (repo visibility: $REPO_VISIBILITY, provenance requires public repos)"
            fi
            npm publish $PROVENANCE_FLAG --tag "$PRERELEASE_TAG" --access public
          else
            yarn npm publish --tag "$PRERELEASE_TAG"
          fi
