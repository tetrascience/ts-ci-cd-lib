name: E2E Tests (CodeBuild)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (e.g. predev3, dev)"
        type: string
        required: true
      deploy_paths:
        description: "Space-separated glob patterns — deploy only if changed files match. Empty string = never deploy."
        type: string
        required: true
      buildspec:
        description: "Path to the buildspec file in the caller repo"
        type: string
        required: true
      deploy_workflow:
        description: "Workflow file that builds and deploys the service (waited on after pushing to env branch)"
        type: string
        default: "ci.yml"
        required: false
      image_override:
        description: "Override the CodeBuild base image (e.g. mcr.microsoft.com/playwright:v1.52.0-noble)"
        type: string
        required: false
      compute_type_override:
        description: "Override the CodeBuild compute type (e.g. BUILD_GENERAL1_MEDIUM for 7GB RAM)"
        type: string
        required: false
      existing_deploy_branch:
        description: "When set, skip the deploy push and instead wait for an existing deploy_workflow run on this branch. Use when CI already deploys on merge (e.g. push to development). Do NOT use for environments released from ts-cloudformation-service — there is no deploy_workflow run to wait for and the wait can never be satisfied. Use await_ecs_cluster/await_ecs_service instead."
        type: string
        required: false
      service_paths:
        description: "Space-separated globs whose change produces a new image. Defaults to deploy_paths. Split them when an environment is released elsewhere: deploy_paths is then empty, but we still need to know whether a rollout is expected."
        type: string
        default: ""
        required: false
      test_paths:
        description: "Space-separated globs that change what the suite asserts (specs, e2e config, buildspec). Only consulted when skip_when_unchanged is true."
        type: string
        default: ""
        required: false
      skip_when_unchanged:
        description: "Skip the suite when neither service_paths nor test_paths matched. A docs or workflow only change deploys nothing, so the suite would otherwise run against whatever image the shared environment happens to hold and report a pass that is evidence for some earlier commit. Default false keeps the previous always-run behaviour."
        type: boolean
        default: false
        required: false
      await_ecs_cluster:
        description: "ECS cluster holding the service under test. Set together with await_ecs_service to gate the suite on the environment actually running the image built from this commit. Cluster names are not derivable from the environment (ts-platform-development, ts-predev5-development, ts-dip-uat), so it is explicit. Leave empty to disable the gate."
        type: string
        default: ""
        required: false
      await_ecs_service:
        description: "ECS service name to poll. See await_ecs_cluster."
        type: string
        default: ""
        required: false
      await_image_tag_prefix:
        description: "Tag namespace written by the caller's cfn-audit-tag workflow, whose annotation carries squash_sha and image_digest. Only used when the ECS gate is enabled."
        type: string
        default: "cfn-image"
        required: false
      timeout_minutes:
        description: "Max minutes for the E2E job — includes buffer for setup steps"
        type: number
        default: 25
        required: false
    secrets:
      JFROG_ARTIFACTORY_NPM_VIRTUAL_URL:
        required: true
      JFROG_ARTIFACTORY_READ_NPM_AUTH:
        required: true
      GITHUB_PAT:
        description: "PAT with cross-repo access and contents:write for deploy push"
        required: true
      ZEPHYR_CYCLE_KEY:
        description: "Optional per-repo Zephyr Scale cycle key. When set, it is passed into the CodeBuild env and takes precedence over the account-scoped SSM cycle key, so a repo's execution results land in its own cycle. Omit to keep the SSM default."
        required: false
      ZEPHYR_API_TOKEN:
        description: "Optional Zephyr Scale API token. Same precedence as ZEPHYR_CYCLE_KEY. Lets a caller supply the token directly instead of relying on the buildspec's own lookup."
        required: false
      ZEPHYR_ACCOUNT_ID:
        description: "Optional Jira account id used for Zephyr executedById. Same precedence as ZEPHYR_CYCLE_KEY."
        required: false

jobs:
  # Environment → AWS coordinates. Its own job because two jobs need the answer
  # (the ECS gate and the suite itself) and a second inline copy of the map is
  # how they drift apart.
  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      account: ${{ steps.env.outputs.account }}
      region: ${{ steps.env.outputs.region }}
      cf_env: ${{ steps.env.outputs.cf_env }}
      source_bucket: ${{ steps.env.outputs.source_bucket }}
    steps:
      - name: Resolve environment
        id: env
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          # The E2E infra (CodeBuild, OIDC role, S3 bucket) comes from
          # infrastructure/tdp-e2e.yaml, deployed either as a substack of the TDP
          # service stack via EnableE2E=true or as a standalone stack.
          # Account IDs and regions are stable infrastructure facts.
          declare -A ACCOUNTS=(
            [predev]=611255221147
            [predev2]=383434869204
            [predev3]=866984931759
            [predev4]=456932089055
            [predev5]=734018046548
            [predev6]=326392129485
            [predev7]=901926888715
            [predev8]=581141123528
            [dev]=706717599419
            [preuat]=555180171822
            [uat]=753968983172
          )

          declare -A REGIONS=(
            [preuat]=us-west-2
            [uat]=us-west-2
          )

          # CloudFormation Environment value used in IAM role names. Must match the
          # tdp-e2e stack's EnvironmentName for that environment.
          declare -A CF_ENVIRONMENTS=(
            [preuat]=preuat
            [uat]=uat
          )

          ACCOUNT="${ACCOUNTS[$TARGET_ENV]:-}"
          REGION="${REGIONS[$TARGET_ENV]:-us-east-2}"
          CF_ENV="${CF_ENVIRONMENTS[$TARGET_ENV]:-development}"

          if [[ -z "$ACCOUNT" ]]; then
            echo "::error::Unknown environment: $TARGET_ENV"
            exit 1
          fi

          {
            echo "account=$ACCOUNT"
            echo "region=$REGION"
            echo "cf_env=$CF_ENV"
            echo "source_bucket=tdp-e2e-source-${ACCOUNT}"
          } >> "$GITHUB_OUTPUT"

  # Classifies the diff once, for three different consumers: whether to deploy,
  # whether a new image is expected to roll out, and whether running the suite
  # proves anything at all.
  check-changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
      service_changed: ${{ steps.check.outputs.service_changed }}
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      # This job used to be gated on `deploy_paths != ''`, which let the check
      # below assume that reaching it at all was the misconfiguration. It now
      # runs unconditionally (should_run has to be computed for callers that
      # never deploy), so the condition it used to get from the job `if` is
      # spelled out here instead.
      - name: Reject deploy_paths for release environments
        if: ${{ inputs.deploy_paths != '' }}
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail

          # These environments are released elsewhere, so deploy_paths has no
          # valid meaning for them. This is a misconfiguration tripwire, not a
          # safety control: the deploy job pushes to a branch named after the
          # environment, and nothing in these environments consumes that.
          #
          # Without the check the run creates a stray branch and then waits for a
          # deploy that never starts, until it times out. Failing immediately with
          # a clear message is cheaper.
          #
          # Keep in sync with ACCOUNTS in the e2e job below.
          RELEASE_ENVIRONMENTS="uat preuat"

          for release_env in $RELEASE_ENVIRONMENTS; do
            if [[ "$TARGET_ENV" == "$release_env" ]]; then
              echo "::error::'$TARGET_ENV' is released from ts-cloudformation-service, not deployed by this pipeline, so deploy_paths has no valid meaning here. Pass deploy_paths: '' to run the suite against what is already deployed."
              exit 1
            fi
          done

          echo "$TARGET_ENV is a pipeline-deployed environment; continuing."

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if service code changed
        id: check
        env:
          DEPLOY_PATHS: ${{ inputs.deploy_paths }}
          # Defaults to deploy_paths, which is what "service code" meant before
          # the two could differ. They differ when the environment is released
          # elsewhere: deploy_paths is empty because there is nothing for this
          # workflow to deploy, but a rollout still happens and we still need to
          # know whether to wait for one.
          SERVICE_PATHS: ${{ inputs.service_paths || inputs.deploy_paths }}
          TEST_PATHS: ${{ inputs.test_paths }}
          SKIP_WHEN_UNCHANGED: ${{ inputs.skip_when_unchanged }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail -f  # -f disables glob expansion so src/** stays literal

          # Belt and braces: the input default above already falls back, but
          # service_changed drives whether we wait for a rollout, and an empty
          # pattern list matches nothing, so a lost fallback would silently
          # answer "no new image" for every commit rather than fail.
          SERVICE_PATHS="${SERVICE_PATHS:-$DEPLOY_PATHS}"

          emit() {
            # should_deploy is meaningless without deploy_paths; force it false
            # rather than leaving the deploy job's `if` to compare against a
            # value that was computed from an empty pattern list.
            local deploy="$1" service="$2" run="$3"
            [[ -n "$DEPLOY_PATHS" ]] || deploy=false
            printf 'should_deploy=%s\nservice_changed=%s\nshould_run=%s\n' \
              "$deploy" "$service" "$run" >> "$GITHUB_OUTPUT"
            echo "should_deploy=$deploy service_changed=$service should_run=$run"
          }

          # A dispatch is a deliberate "run it now" with no diff to reason about.
          # service_changed=false because nothing was merged here, so there is no
          # new image to wait for — the point of a dispatch is to test what is
          # already deployed.
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "Manual dispatch: running the suite, no rollout expected"
            emit true false true
            exit 0
          fi

          if [[ -n "${GITHUB_BASE_REF:-}" ]]; then
            BASE="origin/$GITHUB_BASE_REF"
          elif [[ -n "$BEFORE_SHA" && "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            BASE="$BEFORE_SHA"
          else
            BASE="HEAD~1"
          fi

          # An unresolvable base means we cannot tell what changed. Assume the
          # heaviest case: deploy, expect a rollout, run the suite. Skipping any
          # of those would trade a slow run for a result that is not evidence.
          if ! CHANGED_FILES=$(git diff --name-only "$BASE" HEAD 2>&1); then
            echo "::warning::Could not diff $BASE..HEAD, assuming service code changed"
            emit true true true
            exit 0
          fi

          if [[ -z "$CHANGED_FILES" ]]; then
            echo "No changed files detected, assuming service code changed"
            emit true true true
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          matches() {
            [[ -n "$1" ]] || return 1
            for pattern in $1; do
              while IFS= read -r file; do
                # Use case for glob-style matching — $pattern is intentionally unquoted
                # shellcheck disable=SC2254
                case "$file" in
                  $pattern) echo "Match: $file matches $pattern"; return 0 ;;
                esac
              done <<< "$CHANGED_FILES"
            done
            return 1
          }

          SERVICE=false; TESTS=false; DEPLOY=false
          matches "$SERVICE_PATHS" && SERVICE=true
          matches "$TEST_PATHS" && TESTS=true
          if [[ "$SERVICE_PATHS" == "$DEPLOY_PATHS" ]]; then
            DEPLOY="$SERVICE"
          else
            matches "$DEPLOY_PATHS" && DEPLOY=true
          fi

          RUN=true
          if [[ "$SKIP_WHEN_UNCHANGED" == "true" && "$SERVICE" == "false" && "$TESTS" == "false" ]]; then
            echo "Neither service code nor tests changed, nothing for the suite to prove"
            RUN=false
          fi

          emit "$DEPLOY" "$SERVICE" "$RUN"

  deploy:
    needs: check-changes
    if: ${{ needs.check-changes.outputs.should_deploy == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: e2e-deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      # Lets the "Wait for deploy" step poll the triggered deploy run via the
      # built-in GITHUB_TOKEN (gh run list/watch) instead of the cross-repo PAT.
      # The PAT is still required for the push above (so the deploy workflow's
      # `on: push` fires — GITHUB_TOKEN-authored pushes don't trigger workflows).
      # NOTE: callers must also grant `actions: read` at the workflow/job level,
      # since a reusable workflow's token is capped by the caller's permissions.
      actions: read
    steps:
      # Credentials persist intentionally — the next step pushes to the env branch
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_PAT }}

      - name: Push to environment branch
        if: ${{ inputs.existing_deploy_branch == '' }}
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if git push origin "HEAD:refs/heads/$TARGET_ENV" --force-with-lease 2>&1; then
              echo "Pushed $(git rev-parse HEAD) to $TARGET_ENV"
              exit 0
            fi
            echo "Push attempt $attempt failed (stale ref), retrying..."
            git fetch origin "$TARGET_ENV" 2>/dev/null || true
            sleep $((attempt * 5))
          done
          echo "::error::Failed to push to $TARGET_ENV after 3 attempts"
          exit 1

      - name: Wait for deploy
        env:
          # Same-repo run-status reads only need the built-in token + actions:read
          # (see the job `permissions` above). Using the PAT here caused 401s when
          # it lacked Actions-API validity even though it could still push.
          GH_TOKEN: ${{ github.token }}
          DEPLOY_BRANCH: ${{ inputs.existing_deploy_branch || inputs.environment }}
          DEPLOY_WORKFLOW: ${{ inputs.deploy_workflow }}
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Waiting for $DEPLOY_WORKFLOW on $DEPLOY_BRANCH branch (commit $COMMIT_SHA)..."

          for _attempt in $(seq 1 40); do
            sleep 15
            RUN_ID=$(gh run list --branch "$DEPLOY_BRANCH" --workflow "$DEPLOY_WORKFLOW" --limit 20 --json databaseId,headSha,status \
              | jq -r --arg sha "$COMMIT_SHA" '.[] | select(.headSha == $sha) | .databaseId' | head -1)
            if [[ -n "$RUN_ID" ]]; then
              echo "Found deploy run: $RUN_ID"
              break
            fi
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::Deploy workflow run not found after 10 minutes"
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
          echo "Deploy completed successfully"

  # The second flavour of "wait until the environment is running this commit".
  # `deploy` above waits on a GitHub Actions run, which only works when this
  # repo triggers the deploy. Environments released from ts-cloudformation-service
  # have no such run: the image is built and the ts-platform bump merges before
  # the component PR does, and an AWS pipeline rolls it out afterwards. There is
  # nothing here to trigger or watch, so we watch the result instead.
  #
  # The check is identity, not timing, and that distinction is load bearing.
  # Deployments land that no merge here caused, and an ECS circuit breaker
  # rollback creates a FRESH deployment carrying the OLD task definition and
  # settles to COMPLETED. Both look recent and healthy, so any time based check
  # can pass while the environment serves the previous image. Comparing the
  # digest cannot.
  await-deploy:
    needs: [resolve-target, check-changes]
    if: |
      !cancelled() &&
      needs.resolve-target.result == 'success' &&
      needs.check-changes.result == 'success' &&
      inputs.await_ecs_cluster != '' &&
      inputs.await_ecs_service != '' &&
      needs.check-changes.outputs.service_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
    steps:
      # Credentials persist intentionally, unlike the e2e job's checkout. The
      # audit tag is pushed by a different workflow run seconds after this one
      # starts, so it is usually NOT present at checkout time and the step below
      # has to fetch it. On a private repo an unauthenticated fetch fails, which
      # would look like a missing tag and block the merge for the wrong reason.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # zizmor: ignore[artipacked]
        with:
          fetch-depth: 0

      # The caller's cfn-audit-tag workflow pushes an annotated tag naming the
      # commit the image was built from, the commit it merged as, and the digest.
      # It runs on the same push as this one and finishes in well under a minute,
      # but poll rather than assume, and fail loudly if it never appears.
      - name: Resolve the digest this commit should be running
        id: expected
        env:
          TAG_PREFIX: ${{ inputs.await_image_tag_prefix }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if ! git fetch --tags --quiet origin 2>&1; then
              # Not fatal on its own, the tag may already be local. But if the
              # loop later times out, this line is the difference between "the
              # tag never appeared" and "we could not reach the remote".
              echo "::warning::git fetch --tags failed on attempt $attempt"
            fi
            for tag in $(git for-each-ref "refs/tags/$TAG_PREFIX" --format='%(refname:strip=2)'); do
              body=$(git tag -l --format='%(contents)' "$tag")
              if grep -q "^squash_sha: ${GITHUB_SHA}$" <<< "$body"; then
                digest=$(grep '^image_digest:' <<< "$body" | awk '{print $2}')
                if [[ -z "$digest" ]]; then
                  echo "::error::$tag has no image_digest"
                  exit 1
                fi
                echo "$tag -> $digest"
                echo "digest=$digest" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            done
            echo "no $TAG_PREFIX tag for ${GITHUB_SHA} yet, waiting"
            sleep 15
          done
          echo "::error::No $TAG_PREFIX tag names ${GITHUB_SHA} as its squash_sha after 5 minutes."
          echo "::error::Without it there is no way to know which image this commit should be running."
          exit 1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ needs.resolve-target.outputs.region }}
          role-to-assume: arn:aws:iam::${{ needs.resolve-target.outputs.account }}:role/gha-tdp-e2e-${{ needs.resolve-target.outputs.cf_env }}
          role-session-name: e2e-await-deploy
          role-skip-session-tagging: true

      - name: Wait for the environment to be running exactly that image
        env:
          CLUSTER: ${{ inputs.await_ecs_cluster }}
          SERVICE: ${{ inputs.await_ecs_service }}
          EXPECTED: ${{ steps.expected.outputs.digest }}
        run: |
          set -euo pipefail
          DEADLINE=$(( SECONDS + 20 * 60 ))
          BLIND=0

          while (( SECONDS < DEADLINE )); do
            read -r COUNT TASKDEF ROLLOUT RUNNING DESIRED <<< "$(
              aws ecs describe-services --cluster "$CLUSTER" --services "$SERVICE" \
                --query 'services[0].[length(deployments),deployments[?status==`PRIMARY`]|[0].taskDefinition,deployments[?status==`PRIMARY`]|[0].rolloutState,runningCount,desiredCount]' \
                --output text
            )" || true

            if [[ -z "${TASKDEF:-}" || "$TASKDEF" == "None" ]]; then
              BLIND=$(( BLIND + 1 ))
              # Distinguish "cannot see the service" from "service is not ready".
              if (( BLIND >= 10 )); then
                echo "::error::describe-services returned nothing $BLIND times for $CLUSTER/$SERVICE; this is an access or naming problem, not a slow rollout."
                exit 1
              fi
              sleep 20
              continue
            fi
            BLIND=0

            if ! IMAGE=$(aws ecs describe-task-definition --task-definition "$TASKDEF" \
                 --query 'taskDefinition.containerDefinitions[0].image' --output text 2>&1); then
              # Distinguish "not permitted" from "not ready". Without this the run
              # waits the full 20 minutes and reports a rollout problem when the
              # real answer is that the IAM grant has not reached this account.
              if grep -qi 'AccessDenied\|not authorized' <<< "$IMAGE"; then
                echo "::error::Denied ecs:DescribeTaskDefinition in this account."
                echo "::error::The grant in infrastructure/tdp-e2e.yaml has not reached it yet."
                exit 1
              fi
              echo "describe-task-definition failed transiently, retrying"
              sleep 20
              continue
            fi
            ACTUAL=$(sed 's/.*@//' <<< "$IMAGE")

            if [[ "$COUNT" == "1" && "$ROLLOUT" == "COMPLETED" && "$RUNNING" == "$DESIRED" && "$ACTUAL" == "$EXPECTED" ]]; then
              echo "$CLUSTER/$SERVICE is stable on $EXPECTED"
              exit 0
            fi

            echo "waiting: deployments=$COUNT rollout=$ROLLOUT running=$RUNNING/$DESIRED digest=${ACTUAL:-unknown}"
            sleep 20
          done

          echo "::error::$CLUSTER/$SERVICE is not running $EXPECTED after 20 minutes."
          echo "::error::Refusing to run the suite, because a pass would not be evidence for this commit."
          exit 1

  e2e:
    needs: [resolve-target, check-changes, deploy, await-deploy]
    # !cancelled() rather than always(): always() is also true for a cancelled
    # run, which would launch a full CodeBuild suite nobody is waiting on. Worse,
    # callers serialise on a per-environment concurrency group with
    # cancel-in-progress:false, so that zombie suite would hold the environment
    # lock while the run that superseded it queues behind it.
    #
    # deploy and await-deploy are each skipped on the paths that do not apply,
    # and a skipped dependency would otherwise skip this job too.
    if: |
      !cancelled() &&
      needs.resolve-target.result == 'success' &&
      (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') &&
      (needs.await-deploy.result == 'success' || needs.await-deploy.result == 'skipped') &&
      (needs.check-changes.result == 'success' || needs.check-changes.result == 'skipped') &&
      needs.check-changes.outputs.should_run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ needs.resolve-target.outputs.region }}
          role-to-assume: arn:aws:iam::${{ needs.resolve-target.outputs.account }}:role/gha-tdp-e2e-${{ needs.resolve-target.outputs.cf_env }}
          role-session-name: e2e-codebuild
          role-skip-session-tagging: true

      - name: Upload source to S3
        id: source
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_NAME: ${{ github.repository }}
          SOURCE_BUCKET: ${{ needs.resolve-target.outputs.source_bucket }}
        run: |
          set -euo pipefail
          S3_KEY="${REPO_NAME}/${COMMIT_SHA}.zip"
          zip -r -q /tmp/source.zip . -x '.git/*'
          aws s3 cp /tmp/source.zip "s3://${SOURCE_BUCKET}/${S3_KEY}"
          echo "s3_location=${SOURCE_BUCKET}/${S3_KEY}" >> "$GITHUB_OUTPUT"

      - name: Start CodeBuild
        id: codebuild
        env:
          TARGET_ENV: ${{ inputs.environment }}
          JFROG_URL: ${{ secrets.JFROG_ARTIFACTORY_NPM_VIRTUAL_URL }}
          JFROG_AUTH: ${{ secrets.JFROG_ARTIFACTORY_READ_NPM_AUTH }}
          S3_LOCATION: ${{ steps.source.outputs.s3_location }}
          BUILDSPEC_PATH: ${{ inputs.buildspec }}
          IMAGE_OVERRIDE: ${{ inputs.image_override }}
          COMPUTE_TYPE_OVERRIDE: ${{ inputs.compute_type_override }}
          ZEPHYR_CYCLE_KEY: ${{ secrets.ZEPHYR_CYCLE_KEY }}
          ZEPHYR_API_TOKEN: ${{ secrets.ZEPHYR_API_TOKEN }}
          ZEPHYR_ACCOUNT_ID: ${{ secrets.ZEPHYR_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          ENV_VARS=$(jq -nc '[
            {"name":"E2E_ENVIRONMENT","value":env.TARGET_ENV},
            {"name":"JFROG_ARTIFACTORY_URL","value":env.JFROG_URL},
            {"name":"JFROG_ARTIFACTORY_AUTH","value":env.JFROG_AUTH}
          ]')

          # Forward caller-supplied Zephyr settings only when set, so the buildspec
          # can prefer them over its own defaults. Appended conditionally so
          # callers that omit them are unaffected (no empty override that would
          # otherwise suppress the buildspec's fallback). Useful where a caller
          # holds these values as GitHub secrets already.
          #
          # NOTE for buildspec authors: assigning these unconditionally clobbers
          # what is passed here. Prefer the inbound value:
          #   export ZEPHYR_CYCLE_KEY="${ZEPHYR_CYCLE_KEY:-<your fallback>}"
          for var in ZEPHYR_CYCLE_KEY ZEPHYR_API_TOKEN ZEPHYR_ACCOUNT_ID; do
            value="${!var:-}"
            if [[ -n "$value" ]]; then
              ENV_VARS=$(jq -nc --arg n "$var" --arg v "$value" --argjson base "$ENV_VARS" \
                '$base + [{"name":$n,"value":$v}]')
            fi
          done

          CMD=(aws codebuild start-build
            --project-name tdp-e2e
            --source-type-override S3
            --source-location-override "$S3_LOCATION"
            --buildspec-override "$BUILDSPEC_PATH"
            --environment-variables-override "$ENV_VARS")

          if [[ -n "$IMAGE_OVERRIDE" ]]; then
            CMD+=(--image-override "$IMAGE_OVERRIDE")
          fi
          if [[ -n "$COMPUTE_TYPE_OVERRIDE" ]]; then
            CMD+=(--compute-type-override "$COMPUTE_TYPE_OVERRIDE")
          fi

          startBuild=$("${CMD[@]}")
          buildId=$(echo "$startBuild" | jq -r '.build.id')
          if [[ -z "$buildId" || "$buildId" == "null" ]]; then
            echo "::error::Failed to start CodeBuild — no build ID returned"
            exit 1
          fi
          echo "build_id=$buildId" >> "$GITHUB_OUTPUT"
          echo "Started CodeBuild (tdp-e2e): $buildId"

      - name: Wait for CodeBuild
        id: wait
        env:
          BUILD_ID: ${{ steps.codebuild.outputs.build_id }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          MAX_SECONDS=$((TIMEOUT * 60))
          buildStatus="IN_PROGRESS"
          while [[ $SECONDS -le $MAX_SECONDS ]]; do
            sleep 15
            buildInfo=$(aws codebuild batch-get-builds --ids "$BUILD_ID")
            buildStatus=$(echo "$buildInfo" | jq -r '.builds[0].buildStatus')
            if [[ -z "$buildStatus" || "$buildStatus" == "null" ]]; then
              echo "::warning::Failed to get build status, retrying..."
              continue
            fi
            if [[ "$buildStatus" != "IN_PROGRESS" ]]; then
              break
            fi
          done

          LOG_GROUP=$(echo "$buildInfo" | jq -r '.builds[0].logs.groupName')
          LOG_STREAM=$(echo "$buildInfo" | jq -r '.builds[0].logs.streamName')
          LOG_LINK=$(echo "$buildInfo" | jq -r '.builds[0].logs.deepLink')

          {
            echo "log_group=$LOG_GROUP"
            echo "log_stream=$LOG_STREAM"
            echo "log_link=$LOG_LINK"
            echo "build_status=$buildStatus"
          } >> "$GITHUB_OUTPUT"

          if [[ $SECONDS -gt $MAX_SECONDS ]]; then
            echo "::error::Timeout exceeded ($TIMEOUT min); stopping CodeBuild build $BUILD_ID"
            aws codebuild stop-build --id "$BUILD_ID" 2>/dev/null || true
            exit 1
          fi

      - name: Fetch CodeBuild logs
        if: always() && steps.wait.outputs.log_stream != ''
        env:
          LOG_GROUP: ${{ steps.wait.outputs.log_group }}
          LOG_STREAM: ${{ steps.wait.outputs.log_stream }}
        run: |
          set -euo pipefail
          echo "::group::CodeBuild output"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "$LOG_STREAM" \
            --start-from-head \
            --query 'events[].message' \
            --output text 2>/dev/null || echo "(failed to fetch logs)"
          echo "::endgroup::"

      - name: Write job summary
        if: always() && steps.wait.outputs.build_status != ''
        env:
          BUILD_STATUS: ${{ steps.wait.outputs.build_status }}
          LOG_LINK: ${{ steps.wait.outputs.log_link }}
          BUILD_ID: ${{ steps.codebuild.outputs.build_id }}
          ENVIRONMENT: ${{ inputs.environment }}
        run: |
          if [[ "$BUILD_STATUS" == "SUCCEEDED" ]]; then
            ICON="white_check_mark"
          else
            ICON="x"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## :${ICON}: E2E Tests — ${BUILD_STATUS}

          | | |
          |---|---|
          | **Environment** | \`${ENVIRONMENT}\` |
          | **Build ID** | \`${BUILD_ID}\` |
          | **Status** | ${BUILD_STATUS} |
          | **CloudWatch Logs** | [View logs](${LOG_LINK}) |
          EOF

      - name: Check result
        if: always()
        env:
          BUILD_STATUS: ${{ steps.wait.outputs.build_status }}
          LOG_LINK: ${{ steps.wait.outputs.log_link }}
        run: |
          if [[ "$BUILD_STATUS" == "SUCCEEDED" ]]; then
            echo "E2E tests passed"
          else
            echo "::error::E2E tests failed — status: $BUILD_STATUS"
            echo "::error::CloudWatch logs: $LOG_LINK"
            exit 1
          fi
