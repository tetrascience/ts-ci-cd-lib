name: E2E Tests (CodeBuild)

on:
  workflow_call:
    inputs:
      environment:
        description: "Target environment (e.g. predev5, dev)"
        type: string
        default: "predev5"
        required: false
      deploy_before_e2e:
        description: "Push current commit to env branch and wait for deploy before running E2E tests"
        type: boolean
        default: true
        required: false
      ci_workflow:
        description: "Name of the CI workflow file to wait for (e.g. ci.yml)"
        type: string
        default: "ci.yml"
        required: false
      buildspec:
        description: "Path to the buildspec file in the caller repo"
        type: string
        default: "buildspec.e2e.yml"
        required: false
      env_vars_json:
        description: 'JSON object of env vars to pass to CodeBuild (e.g. {"KEY": "value"})'
        type: string
        default: "{}"
        required: false
      image_override:
        description: "Override the CodeBuild base image (e.g. mcr.microsoft.com/playwright:v1.52.0-noble)"
        type: string
        required: false
      compute_type_override:
        description: "Override the CodeBuild compute type (e.g. BUILD_GENERAL1_MEDIUM for 7GB RAM)"
        type: string
        required: false
      timeout_minutes:
        description: "Max minutes for the E2E job (excludes deploy time)"
        type: number
        default: 20
        required: false
      infra_config_ref:
        description: "Git ref for ts-cloudformation-service env config checkout (leave empty for default branch)"
        type: string
        default: ""
        required: false
    secrets:
      JFROG_ARTIFACTORY_NPM_VIRTUAL_URL:
        required: true
      JFROG_ARTIFACTORY_READ_NPM_AUTH:
        required: true
      GITHUB_PAT:
        description: "PAT with cross-repo access and contents:write for deploy push"
        required: true

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    if: ${{ inputs.deploy_before_e2e }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_PAT }}

      - name: Push to environment branch
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/$TARGET_ENV --force-with-lease
          echo "Pushed $(git rev-parse HEAD) to $TARGET_ENV"

      - name: Wait for deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_PAT }}
          TARGET_ENV: ${{ inputs.environment }}
          CI_WORKFLOW: ${{ inputs.ci_workflow }}
        run: |
          set -euo pipefail
          COMMIT_SHA=$(git rev-parse HEAD)
          echo "Waiting for $CI_WORKFLOW on $TARGET_ENV branch (commit $COMMIT_SHA)..."

          for i in $(seq 1 20); do
            sleep 15
            RUN_ID=$(gh run list --branch "$TARGET_ENV" --workflow "$CI_WORKFLOW" --limit 20 --json databaseId,headSha,status \
              | jq -r --arg sha "$COMMIT_SHA" '.[] | select(.headSha == $sha) | .databaseId' | head -1)
            if [[ -n "$RUN_ID" ]]; then
              echo "Found CI run: $RUN_ID"
              break
            fi
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "::error::CI workflow run not found after 5 minutes"
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
          echo "Deploy completed successfully"

  e2e:
    needs: deploy
    if: ${{ always() && (needs.deploy.result == 'success' || needs.deploy.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout_minutes }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Checkout environment config
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: tetrascience/ts-cloudformation-service
          ref: ${{ inputs.infra_config_ref || '' }}
          token: ${{ secrets.GITHUB_PAT }}
          sparse-checkout: infrastructure/tdp-e2e-environments.yml
          sparse-checkout-cone-mode: false
          path: .infra

      - name: Resolve environment
        id: env
        env:
          TARGET_ENV: ${{ inputs.environment }}
        run: |
          set -euo pipefail
          CONFIG=".infra/infrastructure/tdp-e2e-environments.yml"
          ENV="$TARGET_ENV"

          ACCOUNT=$(yq -r ".environments.${ENV}.account" "$CONFIG")
          REGION=$(yq -r ".environments.${ENV}.region // .defaults.region" "$CONFIG")
          BASE_URL=$(yq -r ".environments.${ENV}.base_url // \"\"" "$CONFIG")
          SSM_ENV=$(yq -r ".environments.${ENV}.ssm_env // .defaults.ssm_env" "$CONFIG")

          if [[ "$ACCOUNT" == "null" || -z "$ACCOUNT" ]]; then
            echo "::error::Unknown environment: $ENV"
            exit 1
          fi

          if [[ -z "$BASE_URL" ]]; then
            PATTERN=$(yq -r ".defaults.base_url_pattern" "$CONFIG")
            BASE_URL="${PATTERN//\{env\}/$ENV}"
          fi

          echo "env=$ENV" >> "$GITHUB_OUTPUT"
          echo "account=$ACCOUNT" >> "$GITHUB_OUTPUT"
          echo "region=$REGION" >> "$GITHUB_OUTPUT"
          echo "base_url=$BASE_URL" >> "$GITHUB_OUTPUT"
          echo "ssm_env=$SSM_ENV" >> "$GITHUB_OUTPUT"
          echo "source_bucket=tdp-e2e-source-${ACCOUNT}" >> "$GITHUB_OUTPUT"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          aws-region: ${{ steps.env.outputs.region }}
          role-to-assume: arn:aws:iam::${{ steps.env.outputs.account }}:role/gha-tdp-e2e-${{ steps.env.outputs.env }}
          role-session-name: e2e-codebuild
          role-skip-session-tagging: true

      - name: Upload source to S3
        id: source
        env:
          COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REPO_NAME: ${{ github.repository }}
          SOURCE_BUCKET: ${{ steps.env.outputs.source_bucket }}
        run: |
          set -euo pipefail
          S3_KEY="${REPO_NAME}/${COMMIT_SHA}.zip"
          zip -r -q /tmp/source.zip . -x '.infra/*' '.git/*'
          aws s3 cp /tmp/source.zip "s3://${SOURCE_BUCKET}/${S3_KEY}"
          echo "s3_location=${SOURCE_BUCKET}/${S3_KEY}" >> "$GITHUB_OUTPUT"

      - name: Start CodeBuild
        id: codebuild
        env:
          BASE_URL: ${{ steps.env.outputs.base_url }}
          SSM_ENV: ${{ steps.env.outputs.ssm_env }}
          JFROG_URL: ${{ secrets.JFROG_ARTIFACTORY_NPM_VIRTUAL_URL }}
          JFROG_AUTH: ${{ secrets.JFROG_ARTIFACTORY_READ_NPM_AUTH }}
          CALLER_ENV_VARS: ${{ inputs.env_vars_json }}
          S3_LOCATION: ${{ steps.source.outputs.s3_location }}
          BUILDSPEC: ${{ inputs.buildspec }}
          IMAGE_OVERRIDE: ${{ inputs.image_override }}
          COMPUTE_TYPE_OVERRIDE: ${{ inputs.compute_type_override }}
        run: |
          set -euo pipefail

          # Convert flat {"KEY":"value"} to CodeBuild format [{"name":"KEY","value":"value"}]
          CALLER_VARS=$(echo "$CALLER_ENV_VARS" | jq '[to_entries[] | {name: .key, value: .value}]')

          BUILTIN_VARS=$(jq -nc '[
            {"name":"E2E_BASE_URL","value":env.BASE_URL},
            {"name":"SSM_ENV","value":env.SSM_ENV},
            {"name":"JFROG_ARTIFACTORY_URL","value":env.JFROG_URL},
            {"name":"JFROG_ARTIFACTORY_AUTH","value":env.JFROG_AUTH}
          ]')
          ENV_VARS=$(echo "$BUILTIN_VARS" | jq --argjson caller "$CALLER_VARS" '. + $caller')

          CMD=(aws codebuild start-build
            --project-name tdp-e2e
            --source-type-override S3
            --source-location-override "$S3_LOCATION"
            --buildspec-override "$BUILDSPEC"
            --environment-variables-override "$ENV_VARS")

          if [[ -n "$IMAGE_OVERRIDE" ]]; then
            CMD+=(--image-override "$IMAGE_OVERRIDE")
          fi
          if [[ -n "$COMPUTE_TYPE_OVERRIDE" ]]; then
            CMD+=(--compute-type-override "$COMPUTE_TYPE_OVERRIDE")
          fi

          startBuild=$("${CMD[@]}")
          buildId=$(echo "$startBuild" | jq -r '.build.id')
          if [[ -z "$buildId" || "$buildId" == "null" ]]; then
            echo "::error::Failed to start CodeBuild — no build ID returned"
            exit 1
          fi
          echo "build_id=$buildId" >> "$GITHUB_OUTPUT"
          echo "Started CodeBuild (tdp-e2e): $buildId"

      - name: Wait for CodeBuild
        env:
          BUILD_ID: ${{ steps.codebuild.outputs.build_id }}
          TIMEOUT: ${{ inputs.timeout_minutes }}
        run: |
          set -euo pipefail
          MAX_SECONDS=$((TIMEOUT * 60))
          buildStatus="IN_PROGRESS"
          while [[ $SECONDS -le $MAX_SECONDS ]]; do
            sleep 15
            buildInfo=$(aws codebuild batch-get-builds --ids "$BUILD_ID")
            buildStatus=$(echo "$buildInfo" | jq -r '.builds[0].buildStatus')
            if [[ -z "$buildStatus" || "$buildStatus" == "null" ]]; then
              echo "::warning::Failed to get build status, retrying..."
              continue
            fi
            if [[ "$buildStatus" != "IN_PROGRESS" ]]; then
              break
            fi
          done
          echo "Build logs: $(echo "$buildInfo" | jq -r '.builds[0].logs.deepLink')"
          if [[ $SECONDS -gt $MAX_SECONDS ]]; then
            echo "::error::Timeout exceeded ($TIMEOUT min)"
            exit 1
          fi
          if [[ "$buildStatus" == "SUCCEEDED" ]]; then
            echo "E2E tests passed"
          else
            echo "::error::E2E tests failed — status: $buildStatus"
            echo "::error::See CloudWatch logs: $(echo "$buildInfo" | jq -r '.builds[0].logs.deepLink')"
            exit 1
          fi
