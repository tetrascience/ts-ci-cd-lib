name: "Knip — unused dependencies & exports check"
description: >
  Runs knip to detect unused dependencies, exports, types, and files.
  Add as a step in your CI workflow. Also usable as a husky pre-commit
  hook via `npx knip` directly.
author: "TetraScience"

inputs:
  working-directory:
    description: "Directory to run knip in (default: repo root)"
    required: false
    default: "."
  config:
    description: "Path to knip config file (default: auto-detected)"
    required: false
    default: ""
  args:
    description: "Additional arguments passed to knip (e.g., --no-exit-code, --include dependencies)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Install knip
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: |
        if ! npx knip --version > /dev/null 2>&1; then
          echo "Installing knip..."
          npm install -g knip
        fi

    - name: Run knip
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        KNIP_CONFIG: ${{ inputs.config }}
        KNIP_ARGS: ${{ inputs.args }}
      run: |
        CMD="npx knip"
        if [[ -n "$KNIP_CONFIG" ]]; then
          CMD="$CMD --config $KNIP_CONFIG"
        fi
        if [[ -n "$KNIP_ARGS" ]]; then
          CMD="$CMD $KNIP_ARGS"
        fi
        echo "Running: $CMD"
        eval "$CMD"

branding:
  icon: "search"
  color: "orange"
